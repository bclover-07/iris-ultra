name: sensei_mobile
description: "Sensei OS - AI Campus Management Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & Networking
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  connectivity_plus: ^6.1.4

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.3.4

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Camera & ML
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.12.0

  # Native Features
  vibration: ^2.0.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  webview_flutter: ^4.12.0

  # Utilities
  intl: ^0.20.2
  fluttertoast: ^8.2.10
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  flutter_markdown: ^0.7.7+1
  speech_to_text: ^7.4.0
  just_audio: ^0.10.5
  audio_session: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/


