<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SENSEI Ultra 3D Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFF8E7; /* Cream background matching Neu-Brutalist palette */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
    #status-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: #FFFDF5;
      border: 2px solid #1E1E1E;
      border-radius: 10px;
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 800;
      color: #1E1E1E;
      box-shadow: 2px 2px 0px #1E1E1E;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      z-index: 10;
    }
    .npu-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00F0FF;
      box-shadow: 0 0 6px #00F0FF;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
  <!-- Three.js and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="status-badge">
    <div class="npu-dot" id="dot"></div>
    <span id="badge-text">3D GLB AVATAR · NPU ACTIVE</span>
  </div>

  <script>
    let scene, camera, renderer, avatarGroup, platform, particles;
    let glbModel = null;
    let mixer = null;
    let animationsMap = {};
    let currentMood = 'idle';
    let clock = new THREE.Clock();

    // Model rigging and morph maps
    let bones = {};
    let faceMeshes = [];
    let morphDict = {};
    let visemeMap = {};
    let expressionMap = {};
    let isGlbLoaded = false;

    // Procedural Fallback Meshes
    let procHead, procBody, procLeftArm, procRightArm;

    // Animation & Emotion Timing
    let blinkTimer = 2.0;
    let blinkTarget = 0.0;
    let blinkVal = 0.0;
    let lipSyncTimer = 0.1;
    let currentViseme = 'None';
    let mousePos = { x: 0, y: 0 };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 0.4, 4.2);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lights matching Avatar3DScene
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5ee, 1.4);
      dirLight.position.set(3, 5, 3);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xb3a0ff, 0.4);
      fillLight.position.set(-2, 3, -1);
      scene.add(fillLight);

      const pointLight = new THREE.PointLight(0xFFD700, 0.7, 10);
      pointLight.position.set(0, 2, 2);
      scene.add(pointLight);

      avatarGroup = new THREE.Group();
      avatarGroup.position.set(0, -1.3, 0);
      scene.add(avatarGroup);

      buildPlatform();
      buildParticles();
      buildProceduralFallback();
      loadGlbModel();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('touchmove', onTouchMove);

      animate();
    }

    function buildPlatform() {
      platform = new THREE.Group();
      platform.position.set(0, -1.35, 0);

      const baseGeo = new THREE.CylinderGeometry(1.0, 1.1, 0.08, 32);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x8B5CF6, roughness: 0.4, metalness: 0.3 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.receiveShadow = true;
      platform.add(base);

      const rimGeo = new THREE.CylinderGeometry(1.15, 1.2, 0.04, 32);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.3, metalness: 0.5 });
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.position.y = -0.05;
      platform.add(rim);

      scene.add(platform);
    }

    function buildParticles() {
      const count = 45;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const palette = [
        [0.55, 0.36, 0.96],
        [1.0, 0.84, 0.0],
        [0.0, 0.9, 1.0],
        [1.0, 0.4, 0.6]
      ];

      for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 5;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 3 + 0.5;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 3;

        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i * 3] = c[0];
        colors[i * 3 + 1] = c[1];
        colors[i * 3 + 2] = c[2];
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.05,
        vertexColors: true,
        transparent: true,
        opacity: 0.6,
        sizeAttenuation: true
      });

      particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    function buildProceduralFallback() {
      const fallbackGroup = new THREE.Group();
      fallbackGroup.name = 'proceduralFallback';

      // Head
      const headGeo = new THREE.SphereGeometry(0.32, 24, 24);
      const headMat = new THREE.MeshStandardMaterial({ color: 0x8B5CF6, roughness: 0.3, metalness: 0.4 });
      procHead = new THREE.Mesh(headGeo, headMat);
      procHead.position.y = 1.35;
      procHead.castShadow = true;

      // Visor
      const visorGeo = new THREE.BoxGeometry(0.38, 0.12, 0.22);
      const visorMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF });
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 0.04, 0.2);
      procHead.add(visor);
      fallbackGroup.add(procHead);

      // Body
      const bodyGeo = new THREE.CylinderGeometry(0.24, 0.34, 0.7, 24);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.4, metalness: 0.2 });
      procBody = new THREE.Mesh(bodyGeo, bodyMat);
      procBody.position.y = 0.75;
      procBody.castShadow = true;
      fallbackGroup.add(procBody);

      // Arms
      const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.5, 16);
      const armMat = new THREE.MeshStandardMaterial({ color: 0x1E1E1E, roughness: 0.5 });

      procLeftArm = new THREE.Mesh(armGeo, armMat);
      procLeftArm.position.set(-0.42, 0.7, 0);
      procLeftArm.rotation.z = 0.2;
      fallbackGroup.add(procLeftArm);

      procRightArm = new THREE.Mesh(armGeo, armMat);
      procRightArm.position.set(0.42, 0.7, 0);
      procRightArm.rotation.z = -0.2;
      fallbackGroup.add(procRightArm);

      avatarGroup.add(fallbackGroup);
    }

    function loadGlbModel() {
      if (typeof THREE.GLTFLoader === 'undefined') {
        console.warn('GLTFLoader not available, using procedural avatar.');
        return;
      }

      const loader = new THREE.GLTFLoader();
      const possiblePaths = ['./model.glb', 'model.glb', '/assets/models/model.glb', '../models/model.glb'];

      function tryLoad(index) {
        if (index >= possiblePaths.length) {
          console.log('All GLB paths evaluated. Using active procedural avatar.');
          return;
        }

        const path = possiblePaths[index];
        loader.load(
          path,
          function (gltf) {
            console.log('GLB Model successfully loaded from:', path);
            isGlbLoaded = true;

            // Remove procedural fallback
            const fallback = avatarGroup.getObjectByName('proceduralFallback');
            if (fallback) avatarGroup.remove(fallback);

            glbModel = gltf.scene;
            glbModel.scale.set(1.45, 1.45, 1.45);
            glbModel.position.set(0, 0, 0);

            // Parse Bones, Meshes, and Morph Targets
            glbModel.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.morphTargetDictionary) {
                  faceMeshes.push(child);
                  Object.entries(child.morphTargetDictionary).forEach(([key, val]) => {
                    morphDict[key.toLowerCase()] = { mesh: child, index: val };
                  });
                }
              }
              if (child.isBone) {
                bones[child.name.toLowerCase()] = child;
              }
            });

            // Map Visemes and Expressions
            mapMorphTargets();

            // Set up GLTF Animation Mixer
            if (gltf.animations && gltf.animations.length > 0) {
              mixer = new THREE.AnimationMixer(glbModel);
              gltf.animations.forEach((clip) => {
                animationsMap[clip.name.toLowerCase()] = mixer.clipAction(clip);
              });
            }

            avatarGroup.add(glbModel);
            document.getElementById('badge-text').innerText = '3D MODEL.GLB · NPU RIGGED';

            if (window.FlutterBridge) {
              window.FlutterBridge.postMessage(JSON.stringify({
                type: 'MODEL_LOADED',
                path: path,
                bonesCount: Object.keys(bones).length,
                morphsCount: Object.keys(morphDict).length
              }));
            }
          },
          undefined,
          function (err) {
            console.warn('Failed path:', path, err);
            tryLoad(index + 1);
          }
        );
      }

      tryLoad(0);
    }

    function mapMorphTargets() {
      const findMorph = (keywords) => {
        for (const kw of keywords) {
          for (const key in morphDict) {
            if (key.includes(kw)) return morphDict[key];
          }
        }
        return null;
      };

      visemeMap['A'] = findMorph(['aa', 'mth_a', 'mouth_a', 'moutha', 'viseme_a', 'mouthopen', 'jawopen']);
      visemeMap['E'] = findMorph(['ee', 'mth_e', 'mouth_e', 'mouthe', 'viseme_e', 'mouthsmile']);
      visemeMap['I'] = findMorph(['ih', 'mth_i', 'mouth_i', 'mouthi', 'viseme_i']);
      visemeMap['O'] = findMorph(['oh', 'mth_o', 'mouth_o', 'moutho', 'viseme_o', 'mouthfunnel']);
      visemeMap['U'] = findMorph(['ou', 'mth_u', 'mouth_u', 'mouthu', 'viseme_u', 'mouthpucker']);
      visemeMap['FV'] = findMorph(['ff', 'mth_v', 'mouth_v', 'viseme_ff', 'viseme_v']);
      visemeMap['L'] = findMorph(['nn', 'mth_l', 'mouth_l', 'viseme_nn', 'viseme_l', 'tongue']);
      visemeMap['MBP'] = findMorph(['pp', 'mth_p', 'mouth_p', 'mouthclosed', 'viseme_pp', 'viseme_m']);
      visemeMap['WQ'] = findMorph(['rr', 'mth_w', 'mouth_w', 'viseme_rr', 'viseme_w']);

      expressionMap['blink_l'] = findMorph(['blink_l', 'eye_close_l', 'eyeblinkleft']);
      expressionMap['blink_r'] = findMorph(['blink_r', 'eye_close_r', 'eyeblinkright']);
      expressionMap['blink'] = findMorph(['blink', 'eye_close', 'close', 'eyesclosed']);
      expressionMap['happy'] = findMorph(['joy', 'smile', 'happy', 'fun', 'mouthsmile']);
      expressionMap['sad'] = findMorph(['sorrow', 'sad', 'frown', 'mouthfrown']);
      expressionMap['confused'] = findMorph(['surprised', 'confused', 'shock', 'browsup']);
      expressionMap['thinking'] = findMorph(['natural', 'neutral']);
    }

    function onPointerMove(e) {
      mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
      mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    function onTouchMove(e) {
      if (e.touches.length > 0) {
        mousePos.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mousePos.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    // Public Bridge API
    window.setMood = function (mood) {
      currentMood = mood.toLowerCase();
      console.log('3D Avatar Mood Set:', currentMood);
      const badge = document.getElementById('badge-text');
      if (badge) {
        badge.innerText = `3D GLB · ${currentMood.toUpperCase()}`;
      }
    };

    window.movePlayer = function (dx, dy) {
      if (avatarGroup) {
        avatarGroup.position.x += dx * 0.1;
        avatarGroup.position.z += dy * 0.1;
      }
    };

    window.triggerCelebration = function () {
      setMood('happy');
      setTimeout(() => setMood('idle'), 4000);
    };

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      if (mixer) mixer.update(delta);

      // Rotate Platform & Floating Particles
      if (platform) platform.rotation.y = t * 0.08;
      if (particles) particles.rotation.y = t * 0.04;

      // GLB Rig Animation Loop
      if (isGlbLoaded && glbModel) {
        // 1. Blinking
        blinkTimer -= delta;
        if (blinkTimer <= 0) {
          if (blinkTarget === 0) {
            blinkTarget = 1.0;
            blinkTimer = 0.12;
          } else {
            blinkTarget = 0.0;
            blinkTimer = Math.random() * 3.5 + 2.0;
          }
        }
        blinkVal = THREE.MathUtils.lerp(blinkVal, blinkTarget, delta * 25);

        const setMorph = (target, val) => {
          if (target && target.mesh && target.mesh.morphTargetInfluences) {
            target.mesh.morphTargetInfluences[target.index] = THREE.MathUtils.lerp(
              target.mesh.morphTargetInfluences[target.index], val, delta * 15
            );
          }
        };

        setMorph(expressionMap['blink'], blinkVal);
        setMorph(expressionMap['blink_l'], blinkVal);
        setMorph(expressionMap['blink_r'], blinkVal);

        // 2. Visemes Lip-Syncing
        if (currentMood === 'talking' || currentMood === 'debate') {
          lipSyncTimer -= delta;
          if (lipSyncTimer <= 0) {
            const visemes = ['A', 'E', 'I', 'O', 'U', 'FV', 'L', 'MBP', 'WQ', 'None'];
            currentViseme = visemes[Math.floor(Math.random() * visemes.length)];
            lipSyncTimer = Math.random() * 0.1 + 0.06;
          }
          if (currentViseme !== 'None' && visemeMap[currentViseme]) {
            setMorph(visemeMap[currentViseme], 0.9);
          }
        }

        // 3. Emotion Morphs
        if (currentMood === 'happy') setMorph(expressionMap['happy'], 0.85);
        else if (currentMood === 'thinking') setMorph(expressionMap['thinking'], 0.65);
        else if (currentMood === 'sad') setMorph(expressionMap['sad'], 0.8);
        else if (currentMood === 'confused') setMorph(expressionMap['confused'], 0.7);

        // 4. Head, Neck, & Spine Tracking
        const headBone = bones['head'] || bones['bip01_head'];
        const neckBone = bones['neck'] || bones['bip01_neck'];
        const spineBone = bones['spine'] || bones['bip01_spine'];

        if (headBone && neckBone) {
          const lookYaw = -mousePos.x * 0.35;
          const lookPitch = mousePos.y * 0.25;

          headBone.rotation.y = THREE.MathUtils.lerp(headBone.rotation.y, lookYaw * 0.5, delta * 6);
          headBone.rotation.x = THREE.MathUtils.lerp(headBone.rotation.x, -lookPitch * 0.4, delta * 6);
          neckBone.rotation.y = THREE.MathUtils.lerp(neckBone.rotation.y, lookYaw * 0.25, delta * 6);
        }

        // 5. Breathing and Bounce
        if (currentMood === 'happy') {
          glbModel.position.y = Math.abs(Math.sin(t * 5)) * 0.08;
        } else if (currentMood === 'thinking') {
          glbModel.position.y = Math.sin(t * 1.5) * 0.02;
          if (headBone) headBone.rotation.x = THREE.MathUtils.lerp(headBone.rotation.x, -0.18, delta * 4);
        } else {
          glbModel.position.y = Math.sin(t * 1.8) * 0.02;
        }
      } else {
        // Procedural Fallback Animation Loop
        if (procHead) {
          procHead.rotation.y = THREE.MathUtils.lerp(procHead.rotation.y, -mousePos.x * 0.4, delta * 5);
          procHead.rotation.x = THREE.MathUtils.lerp(procHead.rotation.x, mousePos.y * 0.3, delta * 5);

          if (currentMood === 'talking') {
            procHead.position.y = 1.35 + Math.sin(t * 12) * 0.02;
          } else if (currentMood === 'thinking') {
            procHead.rotation.z = THREE.MathUtils.lerp(procHead.rotation.z, 0.15, delta * 4);
            procHead.rotation.x = THREE.MathUtils.lerp(procHead.rotation.x, -0.2, delta * 4);
          } else {
            procHead.position.y = 1.35 + Math.sin(t * 2) * 0.015;
            procHead.rotation.z = THREE.MathUtils.lerp(procHead.rotation.z, 0, delta * 4);
          }
        }

        if (procLeftArm && procRightArm) {
          if (currentMood === 'happy' || currentMood === 'celebrating') {
            procLeftArm.rotation.z = THREE.MathUtils.lerp(procLeftArm.rotation.z, 2.2 + Math.sin(t * 8) * 0.2, delta * 8);
            procRightArm.rotation.z = THREE.MathUtils.lerp(procRightArm.rotation.z, -2.2 - Math.sin(t * 8) * 0.2, delta * 8);
          } else if (currentMood === 'talking') {
            procRightArm.rotation.z = -0.2 + Math.sin(t * 6) * 0.25;
            procRightArm.rotation.x = Math.sin(t * 4) * 0.3;
          } else {
            procLeftArm.rotation.z = THREE.MathUtils.lerp(procLeftArm.rotation.z, 0.2, delta * 4);
            procRightArm.rotation.z = THREE.MathUtils.lerp(procRightArm.rotation.z, -0.2, delta * 4);
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
