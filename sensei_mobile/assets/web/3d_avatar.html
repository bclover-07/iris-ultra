<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SENSEI Ultra 3D Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFF8E7; /* Cream background matching Neu-Brutalist palette */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #status-badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: #FFFDF5;
      border: 2px solid #1E1E1E;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 800;
      color: #1E1E1E;
      box-shadow: 2px 2px 0px #1E1E1E;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .npu-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00F0FF;
      box-shadow: 0 0 6px #00F0FF;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="status-badge">
    <div class="npu-dot"></div>
    <span id="badge-text">3D NPU RIG · ACTIVE</span>
  </div>

  <script>
    let scene, camera, renderer, avatarGroup, head, body, leftArm, rightArm, platform, particles;
    let currentMood = 'idle';
    let clock = new THREE.Clock();

    function init() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 1.2, 3.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
      dirLight.position.set(5, 8, 5);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const blueLight = new THREE.PointLight(0x00F0FF, 1.2, 10);
      blueLight.position.set(-3, 2, 2);
      scene.add(blueLight);

      buildAvatar();
      buildPlatform();
      buildParticles();

      window.addEventListener('resize', onWindowResize);
      animate();

      notifyFlutter('ready', { status: '3D Scene Loaded' });
    }

    function buildAvatar() {
      avatarGroup = new THREE.Group();

      // Materials
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1E1E1E, roughness: 0.3 });
      const yellowMat = new THREE.MeshStandardMaterial({ color: 0xFFD93D, roughness: 0.2 });
      const purpleMat = new THREE.MeshStandardMaterial({ color: 0x7C5CFC, roughness: 0.2 });
      const tealMat = new THREE.MeshStandardMaterial({ color: 0x00F0FF, emissive: 0x00F0FF, emissiveIntensity: 0.6 });

      // Body / Torso
      const bodyGeo = new THREE.CylinderGeometry(0.35, 0.25, 0.7, 8);
      body = new THREE.Mesh(bodyGeo, purpleMat);
      body.position.y = 0.6;
      body.castShadow = true;
      avatarGroup.add(body);

      // Core glow
      const coreGeo = new THREE.SphereGeometry(0.12, 16, 16);
      const core = new THREE.Mesh(coreGeo, tealMat);
      core.position.set(0, 0.6, 0.26);
      avatarGroup.add(core);

      // Head
      const headGeo = new THREE.BoxGeometry(0.5, 0.45, 0.45);
      head = new THREE.Mesh(headGeo, yellowMat);
      head.position.y = 1.2;
      head.castShadow = true;
      avatarGroup.add(head);

      // Eyes (Hexagon / Visor look)
      const visorGeo = new THREE.BoxGeometry(0.38, 0.12, 0.05);
      const visor = new THREE.Mesh(visorGeo, darkMat);
      visor.position.set(0, 1.22, 0.24);
      avatarGroup.add(visor);

      const eyeGeo = new THREE.BoxGeometry(0.12, 0.04, 0.02);
      const eyeLeft = new THREE.Mesh(eyeGeo, tealMat);
      eyeLeft.position.set(-0.1, 1.22, 0.27);
      avatarGroup.add(eyeLeft);

      const eyeRight = new THREE.Mesh(eyeGeo, tealMat);
      eyeRight.position.set(0.1, 1.22, 0.27);
      avatarGroup.add(eyeRight);

      // Floating Arms
      const armGeo = new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.08, 0.3, 4, 8) : new THREE.CylinderGeometry(0.08, 0.08, 0.35, 8);
      leftArm = new THREE.Mesh(armGeo, darkMat);
      leftArm.position.set(-0.55, 0.6, 0);
      avatarGroup.add(leftArm);

      rightArm = new THREE.Mesh(armGeo, darkMat);
      rightArm.position.set(0.55, 0.6, 0);
      avatarGroup.add(rightArm);

      avatarGroup.position.y = 0.2;
      scene.add(avatarGroup);
    }

    function buildPlatform() {
      const platGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.15, 16);
      const platMat = new THREE.MeshStandardMaterial({ color: 0xFFFDF5, roughness: 0.4 });
      platform = new THREE.Mesh(platGeo, platMat);
      platform.position.y = -0.1;
      platform.receiveShadow = true;
      scene.add(platform);

      const ringGeo = new THREE.TorusGeometry(1.25, 0.03, 8, 24);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x1E1E1E });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = -0.02;
      scene.add(ring);
    }

    function buildParticles() {
      const partGeo = new THREE.BufferGeometry();
      const count = 40;
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 4;
        positions[i + 1] = Math.random() * 3;
        positions[i + 2] = (Math.random() - 0.5) * 4;
      }

      partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const partMat = new THREE.PointsMaterial({ color: 0x7C5CFC, size: 0.05, transparent: true, opacity: 0.6 });
      particles = new THREE.Points(partGeo, partMat);
      scene.add(particles);
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Base Floating
      avatarGroup.position.y = 0.2 + Math.sin(t * 2) * 0.06;
      head.rotation.y = Math.sin(t * 1.2) * 0.15;

      // Platform slow rotate
      platform.rotation.y = t * 0.2;

      // Particles float
      particles.rotation.y = t * 0.05;

      // Mood-based animations
      if (currentMood === 'talking') {
        head.position.y = 1.2 + Math.sin(t * 12) * 0.02;
        leftArm.rotation.x = Math.sin(t * 6) * 0.4;
        rightArm.rotation.x = -Math.sin(t * 6) * 0.4;
      } else if (currentMood === 'thinking') {
        head.rotation.z = 0.15;
        head.rotation.y = 0.3;
        rightArm.position.y = 0.8;
      } else if (currentMood === 'celebrating') {
        avatarGroup.position.y = 0.3 + Math.abs(Math.sin(t * 5)) * 0.2;
        leftArm.rotation.z = 2.2;
        rightArm.rotation.z = -2.2;
      } else if (currentMood === 'debate') {
        head.rotation.y = Math.sin(t * 3) * 0.25;
        leftArm.rotation.x = 0.6 + Math.sin(t * 4) * 0.3;
      } else if (currentMood === 'interview') {
        head.rotation.x = 0.1 + Math.sin(t * 2) * 0.05;
        leftArm.rotation.z = 0.2;
        rightArm.rotation.z = -0.2;
      } else {
        // Idle
        leftArm.rotation.x = Math.sin(t * 1.5) * 0.1;
        rightArm.rotation.x = -Math.sin(t * 1.5) * 0.1;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // JS API callable from Flutter
    window.setMood = function(mood) {
      currentMood = mood;
      const badge = document.getElementById('badge-text');
      if (badge) badge.innerText = 'RIG: ' + mood.toUpperCase();
      notifyFlutter('mood_changed', { mood });
    };

    window.movePlayer = function(x, y, z) {
      if (avatarGroup) {
        avatarGroup.position.x = x;
        avatarGroup.position.z = z;
      }
    };

    function notifyFlutter(event, data) {
      try {
        if (window.FlutterBridge) {
          window.FlutterBridge.postMessage(JSON.stringify({ event, data }));
        }
      } catch (e) {
        console.log('Flutter bridge message:', event, data);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
